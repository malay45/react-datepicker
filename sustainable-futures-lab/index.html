<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sustainable Futures Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="lab.css" />
  </head>
  <body>
    <!--BODY-->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">Sustainable Futures Lab <small>Practice simulation</small></div>
        <ol class="tracker" id="tracker" aria-label="Progress"></ol>
        <div class="clock">
          <button class="btn ghost small notes-toggle" id="notes-toggle" type="button" aria-controls="notes" aria-expanded="false">Notes</button>
          <span class="timer paused" id="timer" role="timer">30:00</span>
        </div>
      </div>
    </header>
    <div class="layout solo" id="layout">
      <main class="stage" id="stage" tabindex="-1"></main>
      <aside class="notes collapsed" id="notes" aria-label="Notes" hidden></aside>
    </div>
    <div id="dialog-root"></div>
    <!--/BODY-->
    <script src="lab-data.js"></script>
    <script src="lab-engine.js"></script>
    <script src="lab-app.js"></script>
  </body>
</html>
